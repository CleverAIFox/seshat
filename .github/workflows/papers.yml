name: papers
# 주 1회 신규 논문 · 모델을 훑어 `docs/papers.md` 의 「읽을 것」 에 후보를 붙인다(DECISIONS §126).
on:
  schedule:
    - cron: "17 0 * * 1"        # 월요일 09:17 KST. 정각을 피한다 — 그 분에 세상의 작업이 몰린다
  workflow_dispatch:

# ★ **권한을 적는다**(DECISIONS §20). 기본 권한은 저장소 설정을 따른다 — 적지 않으면 설정이 바뀔 때 조용히 달라진다.
#   가지를 밀고 PR 을 열려면 쓰기와 PR 쓰기가 둘 다 든다.
#   ★ **`actions: read` 는 마지막 걸음이 든다**(DECISIONS §315). `branch_status.py` 가
#     `gh run list` 로 PR 가지의 판을 묻는데, 안 적으면 거기서 403 이다 — 그리고 403 은
#     **「이상 없음」 이 아니라 「못 봤다」** 라 그 걸음이 2 로 끝난다.
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      # ★ **의존성이 없다.** 표준 라이브러리만 쓰는 도구라 `uv sync` 를 안 한다 — 예약 작업이
      #   의존성 하나 때문에 조용히 멈추는 자리를 안 만든다
      - run: python3 tools/watch_papers.py --write --days 8

      # ★ **main 을 안 민다**(DECISIONS §30). 봇이 main 을 움직이면 보내 둔 패치의 기준 나무가
      #   갈리고, 받는 쪽은 까닭 모를 「만든 쪽이 모르는 커밋이 있다」 를 본다. 가지와 PR 로만 낸다.
      - name: 바뀌었으면 PR 을 연다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ★ **종료 코드를 가른다.** `git diff --quiet` 는 0 없음 · 1 있음 · 128 고장이다.
          # `&& exit 0` 하나로 쓰면 **고장이 「바뀌었다」 로 읽힌다** — 2026-10-05 에 경로가
          # 움직인 채로 그렇게 돌아, 없는 파일을 `git add` 하다 죽었다(DECISIONS §291).
          # ★ **`--` 로 경로임을 못 박는다.** 없으면 git 이 「revision 인가 path 인가」 를
          # 묻고, 2026-10-05 로그의 첫 줄이 그 `fatal: ambiguous argument` 였다.
          RC=0
          git diff --quiet -- docs/papers.md || RC=$?
          case "$RC" in
            0) echo "  붙일 후보가 없다"; exit 0 ;;
            1) ;;
            *) echo "  git diff 가 $RC 로 죽었다 — 경로를 본다: docs/papers.md" >&2; exit 1 ;;
          esac
          BR="papers/$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add -- docs/papers.md
          git commit -m "논문 대장: $(date -u +%Y-%m-%d) 에 훑은 후보"
          git push -u origin "$BR"
          # ★ **PR 을 못 열면 민 가지를 되돌린다**(DECISIONS §315). 2026-10-19 에 여기서
          #   `gh pr create` 가 실패했고, **가지는 남고 PR 은 없는 반쪽**이 사흘을 앉아
          #   있었다. 둘은 한 거래다 — 뒤가 깨지면 앞을 무른다.
          # ★ **지우기도 실패하면 이름을 대고 죽는다.** 조용히 넘기면 그 반쪽이 또 남고,
          #   다음 주에 **같은 이름으로 못 민다.**
          if gh pr create --base main --head "$BR" \
            --title "논문 대장 — $(date -u +%Y-%m-%d) 후보" \
            --body '`tools/watch_papers.py` 가 훑은 후보다. **요약이 아니라 후보다** — 표 본문의
          「무엇을 했나 · 가져올 것」 은 읽은 사람이 쓴다(DECISIONS §126).

          합치면 `main` 이 움직인다. **보내 둔 패치가 있으면 합친 뒤 다시 받는다**(DECISIONS §30).'
          then
            exit 0
          fi
          echo "  PR 을 못 열었다 — 민 가지 $BR 을 되돌린다(반쪽을 안 남긴다)" >&2
          if git push origin --delete "$BR"; then
            echo "  가지를 지웠다. 다음 판이 처음부터 다시 한다" >&2
          else
            echo "  **가지도 못 지웠다** — 손으로 지운다 : git push origin --delete $BR" >&2
          fi
          exit 1

      # ★ **제 끝에서 제 반쪽을 센다**(DECISIONS §315). 위가 죽어도 돈다(`always`) — 그때가
      #   바로 반쪽이 남는 자리다. 이 기계의 `verify.sh` 도 같은 자를 부른다 : **한 구현,
      #   두 부르는 곳**이다(§57 — 같은 규칙을 두 곳에 적으면 한쪽만 늙는다).
      - name: 떠 있는 반쪽이 없나
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/branch_status.py
