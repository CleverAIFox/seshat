name: ci
on:
  push:
    branches: [main]
  pull_request:

# ★ 러너와 액션 메이저는 thoth 와 같다. `ubuntu-latest` 는 저절로 넘어가고
#   Node 20 액션은 강제 전환이 끝나는 날 멈춘다(thoth §100 · §105).
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: uv sync --group eval
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: python3 tools/check_docs.py
      - run: python3 tools/doc_fsck.py
      - run: python3 tools/check_model_licenses.py
