# GPU 평가 — 셀프 호스티드 러너에서 가설 하나를 잰다(DECISIONS §14 · §131).
#
# ★ 러너는 `gpu` 라벨을 단 기계다. 지금은 GTX 1660 Ti 노트북(WSL2)이고, 새 장비가 오면 같은 라벨로
#   갈아 끼운다 — 이 파일은 바뀌지 않는다.
# ★ **손으로만 돈다**(workflow_dispatch). 가설 번호가 입력이고, evaluate 가 대장에서 `실험` 상태인지
#   확인한다. 푸시마다 GPU 를 돌리지 않는다 — 가설 없이 재지 않는다(DECISIONS §12).
# ★ 비공개 저장소라 셀프 호스티드 러너가 안전하다. 공개 저장소면 남의 PR 이 이 기계에서 돈다.
# ★ 결과(runs/)는 커밋하지 않는다. SSD 레이크에 넣고(DECISIONS §21) 아티팩트로도 남긴다.
name: GPU 평가

on:
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "가설 번호 (H-NNN) — 대장에서 실험 상태"
        required: true
      probes:
        description: "문형 탐침 줄 수"
        default: "200"
      # ★ **기본값을 지우고 필수로 만든다**(DECISIONS §313). 기본이
      #   `translategemma-4b` 였는데 그것은 **서빙 후보가 아닌 옛 팔**이다. 손으로
      #   돌릴 때 그대로 누르면 **엉뚱한 팔을 GPU 시간 들여 재고**, 그 수가 기록에
      #   남아 다음 사람이 지금 것으로 읽는다. **기본값이 틀리면 그 틀림이 조용하다** —
      #   묻게 만드는 쪽이 낫다.
      arms:
        description: "잴 백엔드 — 공백으로 나눈다. 대조군을 먼저 적는다"
        required: true

permissions:
  contents: read

concurrency:
  group: gpu
  cancel-in-progress: false

jobs:
  eval:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: GPU 와 ollama
        run: |
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv
          curl -sf http://127.0.0.1:11434/api/version || { echo "ollama 가 떠 있지 않다 — ollama serve"; exit 1; }
          ollama pull translategemma:4b
      - run: uv sync --group eval
      - run: uv run python tools/check_hypotheses.py
      # ★ **탐침 이름은 가설이 정한다**(DECISIONS §280). 2026-09-22 `h001` 이 박혀 있어서 H-019 를
      #   **H-001 의 탐침으로 쟀고**, 결과 파일만 `H-019-probes-*` 로 복사했다 — 이름과 내용이 갈렸다.
      #   바로 아래 ★ 가 「백엔드 이름을 박지 않는다」 를 적어 놓고 탐침 이름은 박고 있었다
      - name: 탐침을 만든다
        run: uv run python tools/make_probes.py --name "${{ inputs.hypothesis }}" --n "${{ inputs.probes }}"
      # ★ 팔은 입력이 정한다(DECISIONS §27). 워크플로에 백엔드 이름을 박으면 실험마다 이 파일을 고친다
      - name: 팔마다 잰다
        env:
          H: ${{ inputs.hypothesis }}
          ARMS: ${{ inputs.arms }}
        run: |
          for b in $ARMS; do
            uv run python -m seshat.evaluate --backend "$b" --set "data/probes/$H.jsonl" --hypothesis "$H" --name "$H-$b"
          done
      - name: 탐침을 결과와 함께 남긴다 — 대조 도구가 구문을 붙인다
        run: cp "data/probes/${{ inputs.hypothesis }}.jsonl" "runs/${{ inputs.hypothesis }}-probes-${{ github.run_id }}.jsonl"
      # ★ **먼저 아티팩트로 올린다**(DECISIONS §28). 레이크 단계가 실패하면 GPU 시간이 통째로 사라진다 —
      #   결과는 다시 만들 수 없다. `always()` 는 앞 단계가 깨져도 남은 결과를 건진다
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: runs-${{ inputs.hypothesis }}-${{ github.run_id }}
          path: runs/
          if-no-files-found: ignore
      # ★ 러너가 이 기계라서 SSD 레이크에 바로 넣는다(DECISIONS §21). 러너는 `~/actions-runner/.env` 의
      #   SESHAT_DATA 를 받는다. 없으면 이 단계는 실패한다 — 조용히 지나가지 않는다
      # ★ **문이 마지막이 아니라 레이크 앞이다**(DECISIONS §131). 막혀도 결과는 남겨야 한다 —
      #   GPU 시간은 다시 못 만든다. 그래서 아티팩트가 먼저고, 문은 보기만 하고, 레이크는 그대로 넣는다.
      #   **문이 막았다는 사실은 작업을 빨갛게 만들어 남는다**(`continue-on-error` 를 안 쓴다).
      - name: 문 — 지금까지의 최고보다 떨어졌나
        if: always()
        run: |
          for f in runs/*.jsonl; do
            case "$f" in *probes*) continue ;; esac
            uv run python3 tools/gate.py "$f" || blocked=1
          done
          [ -z "${blocked:-}" ] || { echo "문이 막았다 — 기록판보다 떨어진 실행이 있다"; exit 1; }

      - name: 레이크에 넣는다
        if: always()
        run: |
          [ -n "${SESHAT_DATA:-}" ] || { echo "러너에 SESHAT_DATA 가 없다 — ~/actions-runner/.env 에 적고 러너를 다시 띄운다"; exit 1; }
          uv run python tools/lake.py put runs runs/*.jsonl
