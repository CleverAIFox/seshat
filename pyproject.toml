[project]
name = "seshat"
version = "0.3.6"
description = "thoth 에 끼울 영한 번역 모델 — 사전학습 모델을 고르고 좁힌다"
requires-python = ">=3.12"
# ★ **기본 의존성은 0 이다.** 서버 · 평가 · 계약 검사가 표준 라이브러리로 선다.
#   무거운 것은 그룹으로 나눠 필요한 기계에서만 받는다(DECISIONS §4).
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# chrF++. 가볍다 — CPU 만 쓴다
eval = ["sacrebleu>=2.4"]
# AWS Translate 기준선(DECISIONS §11). 서빙에는 쓰지 않는다
# ★ `botocore[crt]` 는 login(IAM Identity Center 계열) 자격증명 제공자가 요구한다 — 없으면 프로필이 있어도
#   `MissingDependencyException` 으로 죽는다(2026-09-23 · DECISIONS §40)
aws = ["boto3>=1.34", "botocore[crt]>=1.34"]
# FLORES+ 를 받는다 — tools/fetch_flores.py
data = ["huggingface_hub>=0.24", "pyarrow>=15"]
# ★ **신경망 자(QE) — 실험 기계에서만 받는다**(DECISIONS §242 · PLAN #3). CI 도 `verify.sh` 도
#   이 그룹 없이 돈다 — **관문이 torch 를 기다리면 사람이 관문을 끈다.** `tools/labels.py corr` 는
#   점수 **파일**을 먹으므로 자를 돌리는 일과 자를 재는 일이 갈려 있다
# ★ **`protobuf` 가 있어야 mT5 의 `spiece.model` 을 빠른 토크나이저로 바꾼다**(2026-09-30 ·
#   DECISIONS §246). 없으면 transformers 5 가 **tiktoken 으로 넘어갔다가** 거기서도 죽는다 —
#   화면에 뜨는 마지막 말이 `pip install tiktoken` 이라 **엉뚱한 것을 깔게 만든다**
# ★ **위아래를 재서 박았다**(2026-09-30 · DECISIONS §246). 무게 없이 작은 mT5 를 세워 앞으로
#   흘려 보고 판마다 물었다 — **4.40 ~ 4.53 은 같은 수를 내고**(소수 여섯 자리까지),
#   4.55 부터 죽는다(`is_updated`), 5 는 `MT5Stack` 이 `embed_tokens` 를 안 받아 아예 안 선다.
#   **원본이 기대는 조건까지 옮기는 것**이 옮기는 일이다(§20).
#   판을 올릴 때는 `qe.py` 의 **탐침**이 먼저 말한다 — 무게를 받기 전에 돈다
qe = ["torch>=2.4", "transformers>=4.40,<4.54", "sentencepiece>=0.2", "protobuf>=4"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ★ thoth 와 같다. 스타일이 아니라 오류만 본다.
[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["F"]
