[project]
name = "seshat"
version = "0.3.6"
description = "thoth 에 끼울 영한 번역 모델 — 사전학습 모델을 고르고 좁힌다"
requires-python = ">=3.12"
# ★ **기본 의존성은 0 이다.** 서버 · 평가 · 계약 검사가 표준 라이브러리로 선다.
#   무거운 것은 그룹으로 나눠 필요한 기계에서만 받는다(DECISIONS §4).
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# chrF++. 가볍다 — CPU 만 쓴다
eval = ["sacrebleu>=2.4"]
# AWS Translate 기준선(DECISIONS §11). 서빙에는 쓰지 않는다
# ★ `botocore[crt]` 는 login(IAM Identity Center 계열) 자격증명 제공자가 요구한다 — 없으면 프로필이 있어도
#   `MissingDependencyException` 으로 죽는다(2026-09-23 · DECISIONS §40)
aws = ["boto3>=1.34", "botocore[crt]>=1.34"]
# FLORES+ 를 받는다 — tools/fetch_flores.py
data = ["huggingface_hub>=0.24", "pyarrow>=15"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ★ thoth 와 같다. 스타일이 아니라 오류만 본다.
[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
# ★ **`RUF100` — 죽은 억제를 막는다**(파이어레인 `tools/suppress.py` · DECISIONS §283).
#   2026-10-03 에 이 저장소의 `# noqa` 56개가 **전부 죽어 있었다** — `select` 가 `F` 하나인데
#   `E402` · `E731` · `N802` · `BLE001` · `C901` 을 적고 있었다. **아무것도 안 막으면서
#   「검사를 통과시켰다」 고 보이는 주석**이고, 파이어레인이 §279-4 로 적은 그 병이다.
#   이 규칙이 있으면 다시 안 생긴다 — 세는 래칫보다 낫다.
#
# ★ **규칙을 더 켜는 쪽은 안 했다.** 켜면 드는 값을 실측했다 —
#   `E402` 36 · `E7` 15(세미콜론 10 · 람다 5) · `BLE001` 53 · `C901` 25 ·
#   `N802` **1082**(이 저장소는 함수 이름이 한글이다) · `E9` **0**.
#   **56개 뒤에 숨은 결함이 하나도 없었다** — `E9` 가 0 이고 나머지는 전부 문체다.
#   파이어레인은 같은 자리에서 「규칙을 켜는 쪽이 낫다」 고 적었는데, 그쪽은 켜면
#   잡히는 것이 있었다. 여기는 없다. **빚이 아닌 것을 빚으로 적지 않는다.**
select = ["F", "RUF100"]
