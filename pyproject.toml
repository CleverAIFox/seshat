[project]
name = "seshat"
version = "0.0.2"
description = "thoth 에 끼울 영한 번역 모델 — 사전학습 모델을 고르고 좁힌다"
requires-python = ">=3.12"
# ★ **기본 의존성은 0 이다.** 서버 · 평가 · 계약 검사가 표준 라이브러리로 선다.
#   무거운 것은 그룹으로 나눠 필요한 기계에서만 받는다(DECISIONS §4).
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# chrF++. 가볍다 — CPU 만 쓴다
eval = ["sacrebleu>=2.4"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ★ thoth 와 같다. 스타일이 아니라 오류만 본다.
[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["F"]
