[[source]]
id = "k8s-docs"
where = "repo:data/train/*.jsonl"
origin = "kubernetes/website · content/en/docs · main 가지의 영어 마크다운"
license = "CC BY 4.0"
uses = ["train"]
how = "tools/fetch_k8s.py"
feeds = ["tools/fetch_k8s.py"]
note = """**동일조건(SA)이 없다** — 뿌릴 때 표시만 하면 된다(DECISIONS §276). AWS 안내서(CC BY-SA)와
갈리는 유일한 점이고, 학생을 내놓을 생각이 있으면 그것이 결정적이다. 그리고 **평가셋과 코퍼스가
아예 달라 오염이 없다** — `d001` · `d002` 는 AWS 안내서 14권에서 467 문서를 떠 왔다.
커밋하지 않는다 — 표시가 붙는 자료라 받는 도구만 커밋하고 데이터는 `data/train/` 에 둔다."""

