# 데이터 카탈로그 — seshat 이 쥐는 데이터는 전부 여기 한 줄이 있다(DECISIONS §22 · MASTER §11).
#
# ★ **카탈로그에 없는 파일은 레이크에 못 들어오고, 레이크에 있으면 실패다.** 파이어레인 sources.yaml 의
#   「여기 없는 파일은 파이프라인에 들어오지 않는다」 를 옮겼다. 강제자는 tools/lake.py · tools/check_catalog.py.
# ★ **쓰임(uses)이 문이다.** 학습 로더는 `seshat.catalog.allowed(id, "train")` 을 묻는다. 라이선스가 미확인인
#   출처는 train 을 달 수 없다 — 도메인 문서를 긁어 학습에 섞는 것이 이 저장소에서 가장 쉬운 사고다.
# ★ 가중치의 라이선스는 여기 적지 않는다. `seshat/licenses.py` 가 정본이다. 같은 사실을 두 곳에 두지 않는다.
#
# 칸
#   id       영구 이름
#   where    `repo:<glob>`(저장소 안) · `lake:<glob>`(SESHAT_DATA 아래). `*` 는 `/` 도 넘는다
#   origin   어디서 왔나. URL 은 적지 않는다 — 깨진다. 다시 찾을 수 있게 제공자와 범위를 적는다
#   license  라이선스 · 약관. 모르면 `미확인` 이라고 적는다. 비워 두지 않는다
#   uses     eval · evidence · train · ontology · reference · serve 중에서
#   how      얻는 방법 — 도구 경로 또는 `사람`

# ── 계층 ── **층 정책의 정본은 이 블록이다**(DECISIONS §114 · 파이어레인 MASTER §18-1).
#
# ★ 종전에는 층이 세 곳에 나뉘어 있었다 — `seshat/paths.py` 의 `TIERS` · `tools/lake.py` 의 `MANAGED` ·
#   `.gitignore` 의 줄들. 셋이 서로를 모르니 판정 파일 자리를 하루에 세 번 옮겼다(DECISIONS §103).
# ★ **`.gitignore` 의 근거는 `regenerable` 이다**(파이어레인 §18-1a R2). 한 명령으로 다시 만들 수 있어서
#   빼는 것이지 크거나 지저분해서가 아니다. **다시 못 만드는 것을 ignore 하면 그 파일은 사실상 소실된다.**
# ★ 강제자는 `tools/check_catalog.py` 다 — 선언과 `.gitignore` · `paths.TIERS` · `lake.MANAGED` 를 대조한다.
#
#   base         repo(저장소 안) · lake(SSD)
#   dirs         base 아래 자리들
#   committed    git 이 드는가
#   regenerable  한 명령으로 다시 만드는가. **`.gitignore` 의 근거다**
#   managed      레이크 해시 대장(MANIFEST.tsv)이 지키는가. `put` 으로만 들어간다
#   what         왜 있는가

[layers."정본"]
base = "repo"
dirs = ["data/ontology", "data/eval"]
committed = true
regenerable = false
managed = false
what = "사람이 손으로 고치는 작은 정본 — 온톨로지 · 평가셋 0판. diff 로 봐야 한다"

[layers."셋"]
base = "repo"
dirs = ["data/bench", "data/probes", "data/domain"]
committed = false
regenerable = true
managed = false
what = "평가셋 — 받거나(fetch_flores · fetch_awsdocs) 만든다(make_probes). 도구를 커밋하고 산출물은 안 한다"

[layers."작업대"]
base = "repo"
dirs = ["runs", "labels"]
committed = false
regenerable = false
managed = false
what = "도구가 쓰는 자리. **다시 못 만든다** — 사람이 `lake.py put` 으로 레이크에 넣는다(DECISIONS §103)"

[layers.raw]
base = "lake"
dirs = ["raw"]
committed = false
regenerable = false
managed = true
what = "바꾸지 않는 원본 — thoth 쌍 · 판정 · 수집한 용어집"

[layers.runs]
base = "lake"
dirs = ["runs"]
committed = false
regenerable = false
managed = true
what = "실험 결과. 그날의 가중치 · 서버 · GPU 시간이라 다시 만들 수 없다. 가설 대장의 근거가 여기 산다"

[layers.cache]
base = "lake"
dirs = ["cache"]
committed = false
regenerable = true
managed = false
what = "다시 받는 것 — 가중치 · 논문 PDF · AWS 문서 클론. 해시를 적으면 받을 때마다 대장이 운다"

