# 데이터 카탈로그 — seshat 이 쥐는 데이터는 전부 여기 한 줄이 있다(DECISIONS §22 · MASTER §11).
#
# ★ **카탈로그에 없는 파일은 레이크에 못 들어오고, 레이크에 있으면 실패다.** 파이어레인 sources.yaml 의
#   「여기 없는 파일은 파이프라인에 들어오지 않는다」 를 옮겼다. 강제자는 tools/lake.py · tools/check_catalog.py.
# ★ **쓰임(uses)이 문이다.** 학습 로더는 `seshat.catalog.allowed(id, "train")` 을 묻는다. 라이선스가 미확인인
#   출처는 train 을 달 수 없다 — 도메인 문서를 긁어 학습에 섞는 것이 이 저장소에서 가장 쉬운 사고다.
# ★ 가중치의 라이선스는 여기 적지 않는다. `seshat/licenses.py` 가 정본이다. 같은 사실을 두 곳에 두지 않는다.
#
# 칸
#   id       영구 이름
#   where    `repo:<glob>`(저장소 안) · `lake:<glob>`(SESHAT_DATA 아래). `*` 는 `/` 도 넘는다
#   origin   어디서 왔나. URL 은 적지 않는다 — 깨진다. 다시 찾을 수 있게 제공자와 범위를 적는다
#   license  라이선스 · 약관. 모르면 `미확인` 이라고 적는다. 비워 두지 않는다
#   uses     eval · evidence · train · ontology · reference · serve 중에서
#   how      얻는 방법 — 도구 경로 또는 `사람`

[[source]]
id = "ontology-aws"
where = "repo:data/ontology/*.jsonl"
origin = "AWS 서비스 · 기능 · API · 개념과 공식 한국어 표기를 사람이 적은 1판(MASTER §9)"
license = "자체 — 이름과 표기라는 사실의 목록"
uses = ["ontology", "eval"]
how = "사람"

[[source]]
id = "eval-seed"
where = "repo:data/eval/*.jsonl"
origin = "평가셋 초안(PLAN #1)"
license = "자체"
uses = ["eval"]
how = "사람"

[[source]]
id = "flores-plus"
where = "repo:data/bench/*.jsonl"
origin = "openlanguagedata/flores_plus · eng_Latn → kor_Hang · dev · devtest"
license = "CC BY-SA 4.0"
uses = ["eval"]
how = "tools/fetch_flores.py"
note = "평가 전용. 학습에 넣으면 이길 대상의 숫자가 거짓말을 한다"

[[source]]
id = "labels"
where = "repo:data/labels/*.jsonl"
origin = "사람이 줄마다 내린 판정 — 뜻이 맞다 · 어긋난다 · 번역이 아니다(H-046)"
license = "자체 — 판정만 든다"
uses = ["eval"]
how = "사람"
note = "**원문도 출력도 적지 않는다.** 줄 id 와 판정뿐이다 — 그래야 CC BY-SA 본문이 저장소에 안 들어온다"

