# 지금까지의 최고와 넘어야 할 선 — `tools/gate.py` 가 읽는다(DECISIONS §131).
#
# ★ **이 파일은 값을 만들지 않는다.** 레이크의 결과 파일이 값을 만들고 여기는 그것을 가리킨다.
#   `run` 칸이 어느 실행인지 적고, 그 파일이 레이크에 있어야 이 줄이 참이다.
# ★ **`guard = true` 인 줄만 막는다.** 나머지는 찍기만 한다 — 지표 여섯을 전부 막으면 잡음에 막힌다.
# ★ **셋이 다르면 비교하지 않는다.** `set_sha256` 이 빈 줄은 아직 못 박은 것이고, 문이 비교를 거절한다.
#   `--update` 가 박는다. 짐작으로 채우지 않는다.
# ★ **`tol` 은 잰 값이다.** 「얼마나 엄격하고 싶은가」 가 아니라 **같은 팔을 두 번 재면 얼마나 다른가**
#   이고, 그것은 재면 나오는 수다(DECISIONS §139). `tol_run` 이 그것을 잰 두 판을 든다. 기계 · ollama 가
#   바뀌면 **다시 재고 나서** 고친다 — 문이 막는다고 올리지 않는다.
# ★ **사전이 바뀌면 막지 않고 말한다.** 사전을 고치면 같은 번역의 점수가 바뀐다(DECISIONS §32 · §96) —
#   그것을 회귀로 읽으면 사전을 못 고친다. 그때는 재채점으로 기준을 다시 박는다.

